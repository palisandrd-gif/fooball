services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matchmind
      POSTGRES_PASSWORD: matchmind
      POSTGRES_DB: matchmind
    ports:
      - "5432:5432"
    volumes:
      - matchmind_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmind -d matchmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matchmind_postgres:
